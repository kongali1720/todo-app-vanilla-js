<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header-center">
            <img src="https://raw.githubusercontent.com/kongali1720/KongWallet-Payment-Gateway-API/main/kop_surat.jpg" width="100%" class="header-img" alt="header">
        </div>

        <!-- TITLE -->
        <h1 class="title">📋 To-Do List</h1>
        <p class="subtitle"><i class="fas fa-calendar-alt"></i> Yuk kelola tugas dengan gaya!</p>

        <!-- JAM & TANGGAL -->
        <div class="datetime">
            <span><i class="fas fa-clock"></i> <span id="clock">00:00:00</span></span>
            <span class="divider">|</span>
            <span><i class="fas fa-calendar"></i> <span id="date">Loading...</span></span>
        </div>

        <!-- FILTER -->
        <div class="filter">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <!-- PROGRESS -->
        <div class="progress-wrapper">
            <div class="progress-ring">
                <svg width="80" height="80">
                    <circle cx="40" cy="40" r="30" fill="none" stroke="#333" stroke-width="6"/>
                    <circle cx="40" cy="40" r="30" fill="none" stroke="#f0883e" stroke-width="6"
                        stroke-linecap="round"
                        stroke-dasharray="188.5"
                        stroke-dashoffset="188.5"
                        id="progress-circle"/>
                </svg>
                <div class="progress-label">
                    <span id="progress-text">0%</span>
                    <small>Progress</small>
                </div>
            </div>
            <div class="stats">
                <div>📊 Total: <strong id="total">0</strong></div>
                <div>✅ Selesai: <strong id="done">0</strong></div>
                <div>⏳ Pending: <strong id="pending">0</strong></div>
            </div>
        </div>

        <!-- INPUT -->
        <div class="input-group">
            <input type="text" id="todo-input" placeholder="Tulis tugas baru..." />
            <select id="category-select">
                <option value="personal">👤 Personal</option>
                <option value="work">💼 Work</option>
                <option value="study">📚 Study</option>
                <option value="shopping">🛒 Shopping</option>
                <option value="other">📌 Other</option>
            </select>
            <input type="date" id="deadline-input" />
            <div class="btn-group">
                <button id="add-btn"><i class="fas fa-plus"></i> Tambah</button>
                <button id="clear-btn"><i class="fas fa-trash"></i> Clear</button>
            </div>
        </div>

        <!-- LIST -->
        <ul id="todo-list"></ul>

        <!-- FOOTER -->
        <div class="footer">
            ❤️ by <strong>Kongali1720</strong>
        </div>

    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
