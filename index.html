<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To-Do List Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <p align="center">
            <img src="https://raw.githubusercontent.com/kongali1720/KongWallet-Payment-Gateway-API/main/kop_surat.jpg" width="100%" class="header-img" alt="header">
        </p>

        <!-- TITLE -->
        <div class="title">
            <i class="fas fa-list-check"></i> To-Do List Pro
            <span class="badge-pro">PRO</span>
        </div>
        <div class="subtitle">
            <i class="fas fa-calendar-alt"></i> <span id="date-display"></span>
        </div>

        <!-- FILTER -->
        <div class="filter-wrapper">
            <button class="filter-btn active" data-filter="all">📋 All</button>
            <button class="filter-btn" data-filter="active">⏳ Active</button>
            <button class="filter-btn" data-filter="completed">✅ Completed</button>
        </div>

        <!-- PROGRESS CHART -->
        <div class="chart-wrapper">
            <div class="chart-ring">
                <svg viewBox="0 0 120 120">
                    <circle cx="60" cy="60" r="50" fill="none" stroke="#21262d" stroke-width="10"/>
                    <circle cx="60" cy="60" r="50" fill="none" stroke="#f0883e" stroke-width="10"
                        stroke-linecap="round"
                        stroke-dasharray="314.159"
                        stroke-dashoffset="314.159"
                        id="chart-circle"/>
                </svg>
                <div class="chart-center">
                    <span id="chart-percent">0%</span>
                    <small>Progress</small>
                </div>
            </div>
            <div class="chart-stats">
                <span><i class="fas fa-tasks"></i> Total: <strong id="total-count">0</strong></span>
                <span><i class="fas fa-check-circle" style="color:#3fb950;"></i> Selesai: <strong id="done-count">0</strong></span>
                <span><i class="fas fa-clock" style="color:#f0883e;"></i> Pending: <strong id="pending-count">0</strong></span>
            </div>
        </div>

        <!-- INPUT -->
        <div class="input-group">
            <input type="text" id="todo-input" placeholder="✍️ Tulis tugas baru..." />
            <select id="category-select">
                <option value="personal">👤 Personal</option>
                <option value="work">💼 Work</option>
                <option value="study">📚 Study</option>
                <option value="shopping">🛒 Shopping</option>
                <option value="other">📌 Other</option>
            </select>
            <input type="date" id="deadline-input" />
            <div class="btn-group">
                <button id="add-btn"><i class="fas fa-plus-circle"></i> Tambah</button>
                <button id="clear-btn"><i class="fas fa-trash-alt"></i> Clear</button>
            </div>
        </div>

        <!-- LIST -->
        <ul id="todo-list"></ul>

        <!-- FOOTER -->
        <div class="footer">
            Made with <i class="fas fa-heart"></i> by <strong>Kongali1720</strong>
            <span class="version">v2.0</span>
        </div>

    </div>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('✅ Service Worker registered'))
                .catch(() => console.log('⚠️ SW registration failed'));
        }
    </script>

    <script type="module" src="js/app.js"></script>
</body>
</html>
