<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #0d1117; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 500px; width: 100%; background: #161b22; padding: 30px; border-radius: 20px; border: 1px solid #30363d; text-align: center; }
        h1 { color: #ffffff; font-size: 28px; margin-bottom: 5px; }
        .sub { color: #8b949e; font-size: 14px; margin-bottom: 15px; }
        .clock { color: #f0f6fc; background: #0d1117; padding: 10px; border-radius: 30px; margin-bottom: 15px; border: 1px solid #21262d; }
        .clock i { color: #f0883e; }
        .filter { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap; }
        .filter button { padding: 6px 18px; border: 1px solid #30363d; border-radius: 20px; background: transparent; color: #8b949e; cursor: pointer; }
        .filter button.active { background: #f0883e; color: #0d1117; border-color: #f0883e; }
        .progress-box { background: #0d1117; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #21262d; }
        .progress-box .ring { display: inline-block; position: relative; width: 80px; height: 80px; }
        .progress-box .ring svg { transform: rotate(-90deg); }
        .progress-box .ring circle { transition: stroke-dashoffset 0.8s; }
        .progress-box .ring .label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
        .progress-box .ring .label span { font-size: 18px; font-weight: 700; }
        .progress-box .ring .label small { font-size: 10px; color: #8b949e; }
        .stats { display: flex; justify-content: center; gap: 15px; color: #8b949e; font-size: 13px; flex-wrap: wrap; margin-top: 10px; }
        .stats strong { color: #fff; }
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .input-group input[type="text"] { padding: 10px 14px; border-radius: 10px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 14px; outline: none; }
        .input-group input[type="text"]:focus { border-color: #f0883e; }
        .input-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .input-row select, .input-row input[type="date"] { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; min-width: 80px; }
        .btn-group { display: flex; gap: 6px; }
        .btn-group button { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .btn-add { background: #f0883e; color: #0d1117; }
        .btn-clear { background: #21262d; color: #fff; border: 1px solid #30363d; }
        #todo-list { list-style: none; max-height: 300px; overflow-y: auto; text-align: left; }
        #todo-list li { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #0d1117; border: 1px solid #21262d; border-radius: 10px; margin-bottom: 6px; }
        #todo-list li span { flex: 1; cursor: pointer; color: #f0f6fc; display: flex; align-items: center; gap: 8px; }
        #todo-list li span i { color: #484f58; width: 18px; }
        #todo-list li.completed span { text-decoration: line-through; color: #484f58; }
        #todo-list li.completed span i { color: #3fb950; }
        #todo-list li .meta { font-size: 11px; color: #8b949e; display: flex; gap: 8px; }
        .delete-btn { background: transparent; border: none; color: #484f58; cursor: pointer; padding: 4px 8px; }
        .delete-btn:hover { color: #f85149; }
        .empty { text-align: center; padding: 30px 10px; color: #484f58; }
        .empty i { font-size: 30px; color: #21262d; display: block; margin-bottom: 8px; }
        .footer { text-align: center; margin-top: 15px; padding-top: 12px; border-top: 1px solid #21262d; color: #484f58; font-size: 12px; }
        @media (max-width: 480px) { .container { padding: 16px; } .input-row { flex-direction: column; } .input-row select, .input-row input[type="date"] { width: 100%; } .stats { gap: 8px; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 To-Do List</h1>
        <p class="sub">Yuk kelola tugas dengan gaya!</p>

        <div class="clock">
            <i class="fas fa-clock"></i> <span id="clock">00:00:00</span>
            &nbsp;|&nbsp;
            <i class="fas fa-calendar"></i> <span id="date">Loading...</span>
        </div>

        <div class="filter">
            <button class="active" data-filter="all">All</button>
            <button data-filter="active">Active</button>
            <button data-filter="completed">Completed</button>
        </div>

        <div class="progress-box">
            <div class="ring">
                <svg width="80" height="80">
                    <circle cx="40" cy="40" r="30" fill="none" stroke="#333" stroke-width="6"/>
                    <circle cx="40" cy="40" r="30" fill="none" stroke="#f0883e" stroke-width="6" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5" id="progress-circle"/>
                </svg>
                <div class="label">
                    <span id="progress-text">0%</span>
                    <small>Progress</small>
                </div>
            </div>
            <div class="stats">
                <div>Total: <strong id="total">0</strong></div>
                <div>Selesai: <strong id="done">0</strong></div>
                <div>Pending: <strong id="pending">0</strong></div>
            </div>
        </div>

        <div class="input-group">
            <input type="text" id="todo-input" placeholder="Tulis tugas baru...">
            <div class="input-row">
                <select id="category-select">
                    <option value="personal">👤 Personal</option>
                    <option value="work">💼 Work</option>
                    <option value="study">📚 Study</option>
                    <option value="shopping">🛒 Shopping</option>
                    <option value="other">📌 Other</option>
                </select>
                <input type="date" id="deadline-input">
                <div class="btn-group">
                    <button class="btn-add" id="add-btn"><i class="fas fa-plus"></i> Tambah</button>
                    <button class="btn-clear" id="clear-btn"><i class="fas fa-trash"></i> Clear</button>
                </div>
            </div>
        </div>

        <ul id="todo-list">
            <div class="empty"><i class="fas fa-face-smile-wink"></i> Belum ada tugas</div>
        </ul>

        <div class="footer">❤️ by <strong>Kongali1720</strong></div>
    </div>

    <script>
        // ===== STORAGE =====
        const KEY = 'todos';
        function load() { try { const d = localStorage.getItem(KEY); return d ? JSON.parse(d) : []; } catch { return []; } }
        function save(t) { try { localStorage.setItem(KEY, JSON.stringify(t)); } catch {} }

        // ===== STATE =====
        let todos = load();
        let filter = 'all';

        // ===== DOM =====
        const list = document.getElementById('todo-list');
        const totalEl = document.getElementById('total');
        const doneEl = document.getElementById('done');
        const pendingEl = document.getElementById('pending');
        const input = document.getElementById('todo-input');
        const category = document.getElementById('category-select');
        const deadline = document.getElementById('deadline-input');

        // ===== CLOCK =====
        function startClock() {
            const c = document.getElementById('clock');
            function u() { const n = new Date(); c.textContent = n.toTimeString().slice(0, 8); }
            u(); setInterval(u, 1000);
        }
        function updateDate() {
            document.getElementById('date').textContent = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }

        // ===== RENDER =====
        function render() {
            let data = [...todos];
            if (filter === 'active') data = data.filter(t => !t.done);
            if (filter === 'completed') data = data.filter(t => t.done);

            list.innerHTML = '';
            if (data.length === 0) {
                list.innerHTML = `<div class="empty"><i class="fas fa-face-smile-wink"></i> Belum ada tugas</div>`;
            } else {
                data.forEach(todo => {
                    const li = document.createElement('li');
                    if (todo.done) li.classList.add('completed');
                    const span = document.createElement('span');
                    span.dataset.id = todo.id;
                    const icon = document.createElement('i');
                    icon.className = todo.done ? 'fas fa-check-circle' : 'far fa-circle';
                    span.appendChild(icon);
                    span.appendChild(document.createTextNode(' ' + todo.text));
                    const meta = document.createElement('div');
                    meta.className = 'meta';
                    if (todo.category) { const c = document.createElement('span'); c.textContent = todo.category; meta.appendChild(c); }
                    if (todo.deadline) { const d = document.createElement('span'); d.textContent = '📅 ' + new Date(todo.deadline).toLocaleDateString('id-ID'); meta.appendChild(d); }
                    const del = document.createElement('button');
                    del.className = 'delete-btn';
                    del.dataset.id = todo.id;
                    del.innerHTML = '<i class="fas fa-trash"></i>';
                    li.appendChild(span);
                    li.appendChild(meta);
                    li.appendChild(del);
                    list.appendChild(li);
                });
            }

            const total = todos.length;
            const done = todos.filter(t => t.done).length;
            totalEl.textContent = total;
            doneEl.textContent = done;
            pendingEl.textContent = total - done;

            const percent = total === 0 ? 0 : Math.round((done / total) * 100);
            const circle = document.getElementById('progress-circle');
            const text = document.getElementById('progress-text');
            if (circle) {
                const circumference = 188.5;
                circle.style.strokeDashoffset = circumference - (percent / 100) * circumference;
            }
            if (text) text.textContent = percent + '%';
        }

        // ===== CRUD =====
        function add() {
            const text = input.value.trim();
            if (!text) return;
            todos.push({ id: Date.now().toString(36) + Math.random().toString(36).substring(2, 6), text, category: category.value, deadline: deadline.value, done: false });
            save(todos);
            input.value = '';
            deadline.value = '';
            render();
        }

        function toggle(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) { todo.done = !todo.done; save(todos); render(); }
        }

        function del(id) {
            todos = todos.filter(t => t.id !== id);
            save(todos);
            render();
        }

        function clearAll() {
            if (!confirm('Hapus semua?')) return;
            todos = [];
            save(todos);
            render();
        }

        // ===== EVENTS =====
        document.getElementById('add-btn').addEventListener('click', add);
        document.getElementById('clear-btn').addEventListener('click', clearAll);
        input.addEventListener('keypress', e => { if (e.key === 'Enter') add(); });
        list.addEventListener('click', e => {
            const target = e.target.closest('span, .delete-btn');
            if (!target) return;
            const id = target.dataset.id;
            if (!id) return;
            if (target.tagName === 'SPAN') toggle(id);
            else if (target.closest('.delete-btn')) del(id);
        });
        document.querySelectorAll('.filter button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filter = btn.dataset.filter;
                render();
            });
        });

        // ===== START =====
        startClock();
        updateDate();
        render();
    </script>
</body>
</html>
