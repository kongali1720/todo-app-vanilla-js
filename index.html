<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 520px;
            width: 100%;
            background: #161b22;
            padding: 28px 24px;
            border-radius: 24px;
            border: 1px solid #30363d;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        /* ===== HEADER ===== */
        .header-img {
            width: 100%;
            border-radius: 16px;
            margin-bottom: 18px;
            border: 2px solid #f0883e;
            display: block;
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .title i {
            color: #f0883e;
            margin-right: 8px;
        }

        .subtitle {
            text-align: center;
            color: #8b949e;
            font-size: 14px;
            margin-top: 4px;
            margin-bottom: 20px;
        }

        .subtitle i {
            margin-right: 6px;
            color: #f0883e;
        }

        /* ===== INPUT ===== */
        .input-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            background: #0d1117;
            padding: 6px 6px 6px 18px;
            border-radius: 50px;
            border: 1px solid #30363d;
            transition: 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #f0883e;
            box-shadow: 0 0 0 3px rgba(240, 136, 62, 0.2);
        }

        #todo-input {
            flex: 1;
            padding: 12px 0;
            border: none;
            outline: none;
            font-size: 15px;
            background: transparent;
            color: #f0f6fc;
        }

        #todo-input::placeholder {
            color: #484f58;
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #add-btn {
            background: #f0883e;
            color: #0d1117;
        }

        #add-btn:hover {
            background: #f6994f;
            transform: scale(1.02);
        }

        #clear-btn {
            background: #21262d;
            color: #f0f6fc;
            border: 1px solid #30363d;
        }

        #clear-btn:hover {
            background: #30363d;
        }

        /* ===== STATS ===== */
        .stats {
            display: flex;
            justify-content: space-around;
            background: #0d1117;
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 18px;
            border: 1px solid #21262d;
        }

        .stats span {
            color: #8b949e;
            font-size: 13px;
            font-weight: 500;
        }

        .stats span i {
            margin-right: 5px;
        }

        .stats .num {
            color: #f0f6fc;
            font-weight: 700;
            font-size: 15px;
        }

        .stats .num.done {
            color: #3fb950;
        }

        .stats .num.pending {
            color: #f0883e;
        }

        /* ===== LIST ===== */
        #todo-list {
            list-style: none;
            max-height: 340px;
            overflow-y: auto;
            padding-right: 4px;
        }

        #todo-list::-webkit-scrollbar {
            width: 5px;
        }
        #todo-list::-webkit-scrollbar-track {
            background: #0d1117;
            border-radius: 10px;
        }
        #todo-list::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 10px;
        }

        #todo-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 50px;
            margin-bottom: 8px;
            transition: 0.2s;
        }

        #todo-list li:hover {
            border-color: #30363d;
            background: #161b22;
        }

        #todo-list li span {
            flex: 1;
            cursor: pointer;
            color: #f0f6fc;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #todo-list li span i {
            font-size: 16px;
            color: #484f58;
            width: 18px;
            text-align: center;
        }

        #todo-list li.completed span {
            text-decoration: line-through;
            color: #484f58;
        }

        #todo-list li.completed span i {
            color: #3fb950;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #484f58;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 40px;
            transition: 0.2s;
        }

        .delete-btn:hover {
            background: #21262d;
            color: #f85149;
        }

        /* ===== EMPTY ===== */
        .empty {
            text-align: center;
            padding: 40px 10px;
            color: #484f58;
        }

        .empty i {
            font-size: 40px;
            color: #21262d;
            display: block;
            margin-bottom: 10px;
        }

        .empty p {
            font-size: 14px;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid #21262d;
            color: #484f58;
            font-size: 12px;
        }

        .footer i {
            color: #f85149;
        }

        .footer strong {
            color: #8b949e;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .container {
                padding: 18px 14px;
            }
            .title {
                font-size: 22px;
            }
            .input-wrapper {
                flex-direction: column;
                background: transparent;
                border: none;
                padding: 0;
                gap: 8px;
            }
            #todo-input {
                background: #0d1117;
                border: 1px solid #21262d;
                border-radius: 50px;
                padding: 12px 18px;
            }
            .btn-group {
                justify-content: center;
            }
            button {
                padding: 10px 16px;
                font-size: 13px;
            }
            .stats {
                flex-wrap: wrap;
                gap: 6px;
                padding: 10px;
            }
            .stats span {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <p align="center">
            <img src="https://raw.githubusercontent.com/kongali1720/KongWallet-Payment-Gateway-API/main/kop_surat.jpg" width="100%" class="header-img" alt="header">
        </p>

        <!-- TITLE -->
        <div class="title">
            <i class="fas fa-list-check"></i> To-Do List
        </div>
        <div class="subtitle">
            <i class="fas fa-calendar-alt"></i> Yuk kelola tugas dengan gaya!
        </div>

        <!-- INPUT -->
        <div class="input-wrapper">
            <input type="text" id="todo-input" placeholder="Tulis tugas baru..." />
            <div class="btn-group">
                <button id="add-btn"><i class="fas fa-plus-circle"></i> Tambah</button>
                <button id="clear-btn"><i class="fas fa-trash-alt"></i> Clear</button>
            </div>
        </div>

        <!-- STATS -->
        <div class="stats">
            <span><i class="fas fa-tasks"></i> Total: <span class="num" id="total-count">0</span></span>
            <span><i class="fas fa-check-circle" style="color:#3fb950;"></i> Selesai: <span class="num done" id="done-count">0</span></span>
            <span><i class="fas fa-clock" style="color:#f0883e;"></i> Pending: <span class="num pending" id="pending-count">0</span></span>
        </div>

        <!-- LIST -->
        <ul id="todo-list"></ul>

        <!-- FOOTER -->
        <div class="footer">
            Made with <i class="fas fa-heart"></i> by <strong>Kongali1720</strong>
        </div>

    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script type="module">
        // ===== STORAGE =====
        const KEY = 'todos';

        function load() {
            try {
                const data = localStorage.getItem(KEY);
                return data ? JSON.parse(data) : [];
            } catch { return []; }
        }

        function save(todos) {
            try {
                localStorage.setItem(KEY, JSON.stringify(todos));
            } catch {}
        }

        // ===== STATE =====
        let todos = load();
        const input = document.getElementById('todo-input');
        const addBtn = document.getElementById('add-btn');
        const clearBtn = document.getElementById('clear-btn');
        const list = document.getElementById('todo-list');
        const totalEl = document.getElementById('total-count');
        const doneEl = document.getElementById('done-count');
        const pendingEl = document.getElementById('pending-count');

        // ===== RENDER =====
        function render() {
            list.innerHTML = '';
            const total = todos.length;
            const done = todos.filter(t => t.done).length;
            const pending = total - done;

            totalEl.textContent = total;
            doneEl.textContent = done;
            pendingEl.textContent = pending;

            if (total === 0) {
                list.innerHTML = `
                    <div class="empty">
                        <i class="fas fa-face-smile-wink"></i>
                        <p>Belum ada tugas, ayo tambahkan!</p>
                    </div>
                `;
                return;
            }

            todos.forEach((todo, idx) => {
                const li = document.createElement('li');
                if (todo.done) li.classList.add('completed');

                const span = document.createElement('span');
                span.dataset.idx = idx;

                const icon = document.createElement('i');
                icon.className = todo.done ? 'fas fa-check-circle' : 'far fa-circle';
                span.appendChild(icon);

                span.appendChild(document.createTextNode(' ' + todo.text));

                const del = document.createElement('button');
                del.className = 'delete-btn';
                del.dataset.idx = idx;
                del.innerHTML = '<i class="fas fa-trash-can"></i>';

                li.appendChild(span);
                li.appendChild(del);
                list.appendChild(li);
            });
        }

        // ===== CRUD =====
        function add() {
            const text = input.value.trim();
            if (!text) return;
            todos.push({ text, done: false });
            save(todos);
            input.value = '';
            render();
        }

        function toggle(idx) {
            todos[idx].done = !todos[idx].done;
            save(todos);
            render();
        }

        function del(idx) {
            todos.splice(idx, 1);
            save(todos);
            render();
        }

        function clearAll() {
            if (todos.length === 0) return;
            if (confirm('Hapus semua tugas?')) {
                todos = [];
                save(todos);
                render();
            }
        }

        // ===== EVENTS =====
        addBtn.addEventListener('click', add);
        input.addEventListener('keypress', e => {
            if (e.key === 'Enter') add();
        });
        clearBtn.addEventListener('click', clearAll);

        list.addEventListener('click', e => {
            const target = e.target.closest('span, .delete-btn');
            if (!target) return;
            const idx = parseInt(target.dataset.idx);

            if (target.tagName === 'SPAN') {
                toggle(idx);
            } else if (target.closest('.delete-btn')) {
                del(idx);
            }
        });

        // ===== START =====
        render();
    </script>

</body>
</html>
